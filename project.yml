name: moodit

options:
  bundleIdPrefix: com.moodit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"

# 코드 서명 — DEVELOPMENT_TEAM 을 프로젝트 전체(모든 framework + 메인 앱)에 적용.
# 다른 머신에서 작업 시 본인 Team ID 로 변경.

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: 5JLM7UY2MY
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  moodit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    dependencies:
      - target: Camera
      - target: FilterEngine
      - target: Marketplace
      - target: Storage
      - target: Models
      - target: DesignSystem
      - target: Auth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        # Bundle ID matches GoogleService-Info.plist (Firebase project: moodit-a9e7a).
        # Firebase only validates the main app's bundle ID; frameworks use com.moodit.*.
        PRODUCT_BUNDLE_IDENTIFIER: com.jayl2kor.moodit.app
        INFOPLIST_FILE: Sources/App/Info.plist
        # 브랜드 자산 — Phase Brand 통합. Asset Catalog 위치: Sources/App/Resources/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Camera:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Camera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.Camera
        GENERATE_INFOPLIST_FILE: YES

  FilterEngine:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/FilterEngine
      - Shaders/BasicYUVShaders.metal
    dependencies:
      - target: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.FilterEngine
        GENERATE_INFOPLIST_FILE: YES

  Models:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.Models
        GENERATE_INFOPLIST_FILE: YES

  Storage:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Storage
    dependencies:
      - target: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.Storage
        GENERATE_INFOPLIST_FILE: YES

  Marketplace:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Marketplace
    dependencies:
      - target: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.Marketplace
        GENERATE_INFOPLIST_FILE: YES

  DesignSystem:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.DesignSystem
        GENERATE_INFOPLIST_FILE: YES

  Auth:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Auth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodit.Auth
        GENERATE_INFOPLIST_FILE: YES

  ModelsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/ModelsTests
    dependencies:
      - target: Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  CameraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/CameraTests
    dependencies:
      - target: Camera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FilterEngineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/FilterEngineTests
    dependencies:
      - target: FilterEngine
      - target: Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MarketplaceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/MarketplaceTests
    dependencies:
      - target: Marketplace
      - target: Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  moodit:
    build:
      targets:
        moodit: all
    test:
      targets:
        - ModelsTests
        - CameraTests
        - FilterEngineTests
        - MarketplaceTests
