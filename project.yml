name: filterMarket

options:
  bundleIdPrefix: com.filtermarket
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"

settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""

targets:
  filterMarket:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/App
    dependencies:
      - target: Camera
      - target: FilterEngine
      - target: Marketplace
      - target: Storage
      - target: Models
      - target: DesignSystem
      - target: Auth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.ios
        INFOPLIST_FILE: Sources/App/Info.plist

  Camera:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Camera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.Camera
        GENERATE_INFOPLIST_FILE: YES

  FilterEngine:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/FilterEngine
      - Shaders/BasicYUVShaders.metal
    dependencies:
      - target: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.FilterEngine
        GENERATE_INFOPLIST_FILE: YES

  Models:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.Models
        GENERATE_INFOPLIST_FILE: YES

  Storage:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Storage
    dependencies:
      - target: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.Storage
        GENERATE_INFOPLIST_FILE: YES

  Marketplace:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Marketplace
    dependencies:
      - target: Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.Marketplace
        GENERATE_INFOPLIST_FILE: YES

  DesignSystem:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.DesignSystem
        GENERATE_INFOPLIST_FILE: YES

  Auth:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Auth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.filtermarket.Auth
        GENERATE_INFOPLIST_FILE: YES

  ModelsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/ModelsTests
    dependencies:
      - target: Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FilterEngineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/FilterEngineTests
    dependencies:
      - target: FilterEngine
      - target: Models
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  filterMarket:
    build:
      targets:
        filterMarket: all
    test:
      targets:
        - ModelsTests
        - FilterEngineTests
