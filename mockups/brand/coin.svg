<?xml version="1.0" encoding="UTF-8"?>
<!--
  Moodit Coin — internal currency icon.
  Gold disc with subtle inner ring + white "M" wordmark initial.
  Use inline at any size; readable down to 12px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Coin">
  <circle cx="12" cy="12" r="11" fill="#B8853A"/>
  <circle cx="12" cy="12" r="9.5" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="0.5"/>
  <text x="12" y="16.5" text-anchor="middle"
        fill="#FFFFFF" font-size="13" font-weight="800"
        font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif"
        letter-spacing="-0.5">M</text>
</svg>
