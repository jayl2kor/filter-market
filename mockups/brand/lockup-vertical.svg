<?xml version="1.0" encoding="UTF-8"?>
<!--
  Moodit Lockup — vertical. Symbol above wordmark, both centered.
  For square containers (splash screen, share cards, large headers).
  Clear space = 1x symbol height on all sides.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Moodit">
  <!-- Symbol — centered horizontally, upper half -->
  <g transform="translate(108, 60)">
    <circle cx="16" cy="16" r="14" fill="none" stroke="#B8853A" stroke-width="3"/>
    <circle cx="56" cy="16" r="14" fill="#B8853A"/>
  </g>
  <!-- Wordmark — centered horizontally, lower half -->
  <text x="160" y="180" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Pretendard Variable', 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-3"
        fill="#0F0F0E">moodit</text>
</svg>
