<!DOCTYPE html>
<!-- P2-03 · Rating form (1-5 stars + short comment) · Light · Bottom Sheet -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>24 · Rating Form — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  /* Background = filter detail (07) faintly visible */
  .bg-faint {
    position: absolute; inset: 0;
    background: var(--bg-1);
    overflow: hidden;
  }
  .bg-faint .photo { position: absolute; inset: 0; opacity: 0.3; }

  /* Bottom sheet */
  .rate-sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--surface-raised);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    box-shadow: var(--elev-3-shadow);
    padding: 0 var(--sp-md) calc(var(--sp-md) + var(--safe-bottom));
    z-index: var(--z-modal);
  }
  .rate-sheet__handle {
    width: 36px; height: 4px;
    background: var(--bg-3);
    border-radius: var(--r-full);
    margin: 8px auto var(--sp-md);
  }
  .rate-sheet__title { font-size: var(--t-headline-size); font-weight: 600; text-align: center; margin: 0; }
  .rate-sheet__sub { font-size: var(--t-subhead-size); color: var(--text-secondary); text-align: center; margin: 4px 0 var(--sp-md); }

  .rate-stars {
    display: flex; justify-content: center; gap: var(--sp-xs);
    padding: var(--sp-md) 0;
  }
  .rate-star {
    width: 44px; height: 44px;
    color: var(--text-tertiary);
    display: grid; place-items: center;
  }
  .rate-star--on { color: var(--accent); }
  .rate-star svg { width: 36px; height: 36px; }

  .rate-label {
    text-align: center;
    font-size: var(--t-headline-size);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: var(--sp-md);
  }

  .rate-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: var(--sp-md);
    justify-content: center;
  }
  .rate-tags .chip { cursor: pointer; }
  .rate-tags .chip--active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }

  .rate-comment {
    width: 100%;
    background: var(--bg-1);
    border: 1px solid var(--border-default);
    border-radius: var(--r-md);
    padding: var(--sp-sm) var(--sp-md);
    font: inherit;
    font-size: var(--t-body-size);
    min-height: 80px;
    resize: none;
    line-height: 1.5;
    margin-bottom: var(--sp-md);
  }

  .rate-foot { display: flex; gap: var(--sp-xs); }
  .rate-foot .btn { flex: 1; }

  .scrim {
    position: absolute; inset: 0;
    background: var(--surface-overlay);
    z-index: calc(var(--z-modal) - 1);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="bg-faint">
      <div class="photo photo--vintage"></div>
    </div>
    <div class="scrim"></div>

    <section class="rate-sheet" role="dialog" aria-labelledby="rate-title">
      <div class="rate-sheet__handle"></div>
      <h2 id="rate-title" class="rate-sheet__title">평점 남기기</h2>
      <p class="rate-sheet__sub">Sunset 1973 — @jisoo.films</p>

      <div class="rate-stars" role="radiogroup" aria-label="별점">
        <button class="rate-star rate-star--on" aria-label="1점"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 18 L6 22 L7 15 L2 10 L9 9 Z"/></svg></button>
        <button class="rate-star rate-star--on" aria-label="2점"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 18 L6 22 L7 15 L2 10 L9 9 Z"/></svg></button>
        <button class="rate-star rate-star--on" aria-label="3점"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 18 L6 22 L7 15 L2 10 L9 9 Z"/></svg></button>
        <button class="rate-star rate-star--on" aria-label="4점"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 18 L6 22 L7 15 L2 10 L9 9 Z"/></svg></button>
        <button class="rate-star rate-star--on" aria-label="5점"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 L15 9 L22 10 L17 15 L18 22 L12 18 L6 22 L7 15 L2 10 L9 9 Z"/></svg></button>
      </div>
      <div class="rate-label">최고예요!</div>

      <div class="rate-tags" role="group" aria-label="태그">
        <span class="chip chip--active chip--small">자연스러움</span>
        <span class="chip chip--active chip--small">강도 조절 좋음</span>
        <span class="chip chip--small">카페 잘 어울림</span>
        <span class="chip chip--small">셀카 좋음</span>
        <span class="chip chip--small">여행</span>
        <span class="chip chip--small">실내 광원</span>
      </div>

      <textarea class="rate-comment" maxlength="280" placeholder="짧은 코멘트 (선택). 280자 이내로 메이커에게 의견 남기기">필름 카페 사진에 정말 잘 어울려요. 강도 80%가 베스트.</textarea>

      <div class="rate-foot">
        <button class="btn btn--secondary btn--lg">건너뛰기</button>
        <button class="btn btn--primary btn--lg">평점 등록</button>
      </div>
    </section>
  </div>
</div>
</body>
</html>
