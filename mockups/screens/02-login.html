<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>02 · Login — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .login {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 var(--screen-pad);
    background:
      radial-gradient(80% 60% at 50% 20%, var(--accent-bg) 0%, transparent 60%),
      var(--bg-0);
  }
  .login__brand {
    margin-top: 88px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--sp-md);
  }
  .login__logo {
    width: 64px;
    height: 64px;
    border-radius: var(--r-lg);
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    display: grid;
    place-items: center;
    color: var(--accent);
    box-shadow: 0 8px 24px rgba(184, 133, 58, 0.12), 0 1px 0 rgba(15,15,14,0.04);
  }
  .login__title { letter-spacing: -0.4px; text-align: center; color: var(--text-primary); }
  .login__subtitle {
    color: var(--text-secondary);
    text-align: center;
    margin-top: var(--sp-xs);
    max-width: 280px;
    word-break: keep-all;
  }
  .login__buttons {
    margin-top: auto;
    margin-bottom: var(--sp-2xl);
    display: flex;
    flex-direction: column;
    gap: var(--sp-sm);
  }
  .btn--apple {
    background: #0F0F0E;
    color: #FFFFFF;
  }
  .btn--apple:hover { background: #2A2A28; }
  .btn--google {
    background: var(--bg-2);
    color: var(--text-primary);
    border: 1px solid var(--border-default);
  }
  .btn--google:hover { background: var(--bg-1); }
  .login__terms {
    margin-top: var(--sp-md);
    font-size: var(--t-footnote-size);
    line-height: var(--t-footnote-lh);
    color: var(--text-tertiary);
    text-align: center;
  }
  .login__terms a {
    color: var(--text-secondary);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .login__divider {
    display: flex;
    align-items: center;
    gap: var(--sp-md);
    color: var(--text-tertiary);
    font-size: var(--t-caption-size);
    letter-spacing: 0.4px;
    margin: var(--sp-xs) 0;
  }
  .login__divider::before, .login__divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-subtle);
  }
  .guest {
    text-align: center;
    color: var(--text-tertiary);
    font-size: var(--t-callout-size);
    margin-top: var(--sp-md);
  }
  .guest a { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12" aria-hidden="true"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 18 12" aria-hidden="true"><path d="M2 7 a7 7 0 0 1 14 0" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M5 9 a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <main class="screen login">
      <div class="screen__top-spacer"></div>
      <section class="login__brand fade-in">
        <div class="login__logo" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5 L3 18 a2 2 0 0 0 2 2 L19 20 a2 2 0 0 0 2 -2 L21 7.5 a2 2 0 0 0 -2 -2 L17 5.5 L15 3 L9 3 L7 5.5 L5 5.5 a2 2 0 0 0 -2 2 Z"/>
            <circle cx="12" cy="13" r="4"/>
            <circle cx="12" cy="13" r="1.5" fill="currentColor"/>
          </svg>
        </div>
        <h1 class="t-display login__title fade-in fade-in--delay-1">moodit</h1>
        <p class="t-body login__subtitle fade-in fade-in--delay-2">
          모두의 필터, 단 하나의 마켓.<br/>
          촬영하고, 만들고, 거래하세요.
        </p>
      </section>

      <section class="login__buttons fade-in fade-in--delay-3">
        <button class="btn btn--block btn--lg btn--apple" aria-label="Apple로 계속하기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16.4 1c.1 1.4-.4 2.7-1.3 3.6-.9 1-2.3 1.7-3.6 1.6-.1-1.3.5-2.7 1.3-3.6 1-1 2.4-1.6 3.6-1.6zm4.4 17.4c-.7 1.6-1.1 2.3-2 3.7-1.3 1.9-3.1 4.3-5.4 4.3-2 0-2.6-1.3-5.3-1.3-2.7 0-3.3 1.3-5.3 1.3-2.3 0-4-2.2-5.3-4.1-3.6-5.5-4-12-1.8-15.4 1.6-2.4 4.1-3.8 6.4-3.8 2.4 0 3.9 1.3 5.9 1.3 1.9 0 3.1-1.3 5.9-1.3 2.1 0 4.4 1.2 6 3.2-5.3 2.9-4.4 10.5-1.1 12.1z" transform="translate(0,0)"/>
          </svg>
          Apple로 계속하기
        </button>

        <button class="btn btn--block btn--lg btn--google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1 0-.74.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.83z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.83c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Google로 계속하기
        </button>

        <button class="btn btn--block btn--lg btn--secondary">
          <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6 L21 6 L21 18 L3 18 Z"/>
            <path d="M3 6 L12 13 L21 6"/>
          </svg>
          이메일로 계속
        </button>

        <div class="login__divider">또는</div>
        <div class="guest">
          <a href="#">로그인 없이 둘러보기 →</a>
        </div>

        <p class="login__terms">
          계속을 누르면 <a href="#">이용약관</a> 과 <a href="#">개인정보처리방침</a> 에 동의하는 것으로 간주됩니다.
        </p>
      </section>
      <div class="screen__bottom-spacer"></div>
    </main>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
