<!DOCTYPE html>
<!-- W-05 · CURRENCY_DESIGN §5 — Maker coin → fiat withdrawal · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>47 · Earnings Withdraw — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .wd { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding-top: var(--safe-top); }
  .wd__body { flex: 1; overflow-y: auto; padding: var(--sp-md); }

  .wd__hero {
    background: linear-gradient(135deg, var(--accent) 0%, #8B5E1F 100%);
    color: #fff;
    padding: var(--sp-md);
    border-radius: var(--r-lg);
    margin-bottom: var(--sp-md);
    box-shadow: var(--elev-2-shadow);
  }
  .wd__hero-label {
    font-size: var(--t-caption-size);
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0;
  }
  .wd__hero-amount {
    font-size: 40px; font-weight: 700;
    letter-spacing: -1px; line-height: 1;
    margin: 4px 0 var(--sp-xs);
    display: flex; align-items: center; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .wd__hero-amount .coin { width: 28px; height: 28px; }
  .wd__hero-meta { font-size: var(--t-caption-size); opacity: 0.85; }

  /* Amount input */
  .wd__amount-card {
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r-lg);
    padding: var(--sp-md);
    margin-bottom: var(--sp-md);
  }
  .wd__amount-label {
    font-size: var(--t-caption-size);
    font-weight: 700;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 0 0 var(--sp-xs);
  }
  .wd__amount-input {
    display: flex; align-items: center; gap: var(--sp-sm);
    padding: var(--sp-sm) 0;
    border-bottom: 1px solid var(--border-default);
  }
  .wd__amount-input input {
    flex: 1;
    font: inherit;
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    background: transparent;
    border: 0; outline: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .wd__amount-icon { color: var(--accent); flex: 0 0 28px; }

  .wd__amount-quick {
    display: flex; gap: var(--sp-xs);
    margin-top: var(--sp-sm);
  }
  .wd__amount-quick .chip { flex: 1; text-align: center; justify-content: center; cursor: pointer; }

  .wd__amount-conv {
    margin-top: var(--sp-sm);
    padding-top: var(--sp-sm);
    border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-between;
    font-size: var(--t-subhead-size);
  }
  .wd__amount-conv-value { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* Bank account */
  .wd__bank {
    background: var(--bg-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-md);
    padding: var(--sp-sm) var(--sp-md);
    display: flex; align-items: center; gap: var(--sp-sm);
    margin-bottom: var(--sp-md);
  }
  .wd__bank-logo {
    width: 36px; height: 36px;
    background: #FFD400;
    border-radius: var(--r-sm);
    display: grid; place-items: center;
    color: #000;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: -1px;
    flex: 0 0 36px;
  }
  .wd__bank-info { flex: 1; }
  .wd__bank-name { font-size: var(--t-callout-size); font-weight: 600; margin: 0; }
  .wd__bank-acct { font-size: var(--t-caption-size); color: var(--text-tertiary); margin: 2px 0 0; }
  .wd__bank-change { color: var(--accent); font-size: var(--t-subhead-size); font-weight: 600; }

  /* Fee breakdown */
  .wd__breakdown {
    background: var(--bg-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg);
    overflow: hidden;
    margin-bottom: var(--sp-md);
  }
  .wd__breakdown-row {
    display: flex; justify-content: space-between;
    padding: var(--sp-sm) var(--sp-md);
    font-size: var(--t-subhead-size);
  }
  .wd__breakdown-row + .wd__breakdown-row { border-top: 1px solid var(--border-subtle); }
  .wd__breakdown-label { color: var(--text-secondary); }
  .wd__breakdown-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .wd__breakdown-row--total { background: var(--accent-bg); }
  .wd__breakdown-row--total .wd__breakdown-label,
  .wd__breakdown-row--total .wd__breakdown-value { color: var(--accent); font-weight: 700; font-size: var(--t-callout-size); }

  /* Notice */
  .wd__notice {
    background: var(--info-bg);
    color: var(--info);
    padding: var(--sp-sm) var(--sp-md);
    border-radius: var(--r-md);
    font-size: var(--t-caption-size);
    line-height: 1.4;
    word-break: keep-all;
    margin-bottom: var(--sp-md);
    display: flex; gap: var(--sp-xs);
  }
  .wd__notice-icon { width: 14px; height: 14px; flex: 0 0 14px; margin-top: 2px; }

  .wd__foot {
    flex: 0 0 auto;
    padding: var(--sp-md) var(--sp-md) calc(var(--sp-md) + var(--safe-bottom));
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-1);
  }

  .coin { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="wd">
      <header class="topbar">
        <button class="topbar__action" aria-label="뒤로">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 6 L9 12 L15 18"/></svg>
        </button>
        <span class="topbar__title">출금 신청</span>
        <button class="topbar__action" aria-label="도움말">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 9 a3 3 0 1 1 4 2.5 c-1 .6 -1 1 -1 1.5 M12 17 h.01"/></svg>
        </button>
      </header>

      <div class="wd__body">
        <section class="wd__hero">
          <p class="wd__hero-label">출금 가능 코인</p>
          <p class="wd__hero-amount">
            <svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#fff"/><text x="12" y="16.5" text-anchor="middle" fill="#A0721E" font-size="13" font-weight="800" font-family="-apple-system, system-ui, sans-serif" letter-spacing="-0.5">M</text></svg>
            <span>17,742</span>
          </p>
          <p class="wd__hero-meta">≈ ₩248,400 · 환율 1 코인 = ₩14 (이번 달)</p>
        </section>

        <div class="wd__amount-card">
          <p class="wd__amount-label">출금할 코인</p>
          <div class="wd__amount-input">
            <svg class="wd__amount-icon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><text x="12" y="16.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="800" font-family="-apple-system, system-ui, sans-serif" letter-spacing="-0.5">M</text></svg>
            <input type="number" inputmode="numeric" value="10,000" aria-label="출금 코인 수"/>
          </div>
          <div class="wd__amount-quick">
            <span class="chip">25%</span>
            <span class="chip chip--active">50%</span>
            <span class="chip">최대</span>
          </div>
          <div class="wd__amount-conv">
            <span style="color: var(--text-tertiary);">환산</span>
            <span class="wd__amount-conv-value">₩140,000</span>
          </div>
        </div>

        <p class="wd__amount-label" style="margin: 0 0 var(--sp-xs); color: var(--text-tertiary); font-size: var(--t-caption-size); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;">입금 계좌</p>
        <div class="wd__bank">
          <div class="wd__bank-logo">국민</div>
          <div class="wd__bank-info">
            <p class="wd__bank-name">국민은행 정지수</p>
            <p class="wd__bank-acct">****-***-****567 · 인증됨</p>
          </div>
          <button class="wd__bank-change">변경</button>
        </div>

        <p class="wd__amount-label" style="margin: 0 0 var(--sp-xs); color: var(--text-tertiary); font-size: var(--t-caption-size); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;">정산 내역</p>
        <div class="wd__breakdown">
          <div class="wd__breakdown-row">
            <span class="wd__breakdown-label">출금 코인</span>
            <span class="wd__breakdown-value">10,000 C</span>
          </div>
          <div class="wd__breakdown-row">
            <span class="wd__breakdown-label">환산 (1 C = ₩14)</span>
            <span class="wd__breakdown-value">₩140,000</span>
          </div>
          <div class="wd__breakdown-row">
            <span class="wd__breakdown-label">Stripe 송금 수수료</span>
            <span class="wd__breakdown-value" style="color: var(--text-tertiary);">−₩1,400</span>
          </div>
          <div class="wd__breakdown-row">
            <span class="wd__breakdown-label">소득세 원천징수 (3.3%)</span>
            <span class="wd__breakdown-value" style="color: var(--text-tertiary);">−₩4,580</span>
          </div>
          <div class="wd__breakdown-row wd__breakdown-row--total">
            <span class="wd__breakdown-label">실 입금액</span>
            <span class="wd__breakdown-value">₩134,020</span>
          </div>
        </div>

        <div class="wd__notice">
          <svg class="wd__notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="8"/><path d="M12 8 V13 M9 3 L15 3"/></svg>
          <span><strong>처리 시간</strong>: 영업일 기준 2~3일 내 입금. 신청 후 24시간 내 취소 가능.</span>
        </div>
      </div>

      <div class="wd__foot">
        <button class="btn btn--primary btn--lg btn--block">10,000 코인 출금 신청</button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
