<!DOCTYPE html>
<!-- P6-02 · CURRENCY_DESIGN §4 — Pro Membership (all premium filters + monthly coin grant) · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>38 · Pro Membership — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .sub { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding-top: var(--safe-top); }

  .sub__hero {
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
  }
  .sub__hero-photos {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr;
    gap: 2px;
  }
  .sub__hero-photos .photo { position: relative; }
  .sub__hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(15,15,14,0.9));
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: var(--sp-md);
    color: #fff;
  }
  .sub__hero-eyebrow { font-size: 10px; font-weight: 700; color: var(--accent-soft); letter-spacing: 0.6px; text-transform: uppercase; margin: 0 0 4px; }
  .sub__hero-title { font-size: var(--t-title-lg-size); font-weight: 700; letter-spacing: -0.3px; margin: 0; line-height: 1.1; }
  .sub__hero-sub { font-size: var(--t-subhead-size); opacity: 0.85; margin: 4px 0 0; word-break: keep-all; }

  .sub__close-btn {
    position: absolute; top: var(--sp-md); right: var(--sp-md);
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    border-radius: var(--r-full);
    display: grid; place-items: center;
    color: #fff;
    z-index: 5;
  }

  .sub__body { flex: 1; overflow-y: auto; padding: var(--sp-md); }

  .sub__benefits { display: flex; flex-direction: column; gap: var(--sp-xs); margin-bottom: var(--sp-md); }
  .sub__benefit { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-xs) 0; }
  .sub__benefit-icon {
    width: 32px; height: 32px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: var(--r-full);
    display: grid; place-items: center;
    flex: 0 0 32px;
  }
  .sub__benefit-name { font-size: var(--t-callout-size); font-weight: 600; color: var(--text-primary); }
  .sub__benefit-desc { font-size: var(--t-caption-size); color: var(--text-secondary); margin-top: 2px; }
  .sub__benefit-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--accent-bg);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: var(--r-sm);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .sub__plans { display: flex; flex-direction: column; gap: var(--sp-xs); margin-bottom: var(--sp-md); }
  .sub__plan {
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r-lg);
    padding: var(--sp-md);
    display: flex; align-items: center; gap: var(--sp-sm);
    position: relative;
  }
  .sub__plan--active {
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 4px var(--accent-ring);
    padding: calc(var(--sp-md) - 1px);
  }
  .sub__radio {
    width: 22px; height: 22px;
    border: 2px solid var(--border-default);
    border-radius: var(--r-full);
    flex: 0 0 22px;
    display: grid; place-items: center;
  }
  .sub__plan--active .sub__radio { border-color: var(--accent); }
  .sub__plan--active .sub__radio::after { content: ''; width: 10px; height: 10px; background: var(--accent); border-radius: var(--r-full); }
  .sub__plan-info { flex: 1; }
  .sub__plan-name { font-size: var(--t-headline-size); font-weight: 700; margin: 0; }
  .sub__plan-meta { font-size: var(--t-caption-size); color: var(--text-tertiary); margin: 2px 0 0; }
  .sub__plan-bonus {
    font-size: var(--t-caption-size);
    color: var(--accent);
    font-weight: 700;
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .sub__plan-bonus .coin { width: 12px; height: 12px; }
  .sub__plan-price-row { text-align: right; }
  .sub__plan-price { font-size: var(--t-headline-size); font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .sub__plan-suffix { font-size: var(--t-caption-size); color: var(--text-tertiary); display: block; }
  .sub__plan-badge {
    position: absolute; top: -10px; right: var(--sp-md);
    background: var(--accent);
    color: var(--text-inverse);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.4px;
    padding: 4px 10px;
    border-radius: var(--r-full);
  }

  .sub__cta {
    width: 100%; height: 52px;
    background: var(--accent);
    color: var(--text-inverse);
    border-radius: var(--r-md);
    font-size: var(--t-headline-size);
    font-weight: 700;
    margin-bottom: var(--sp-sm);
  }
  .sub__legal {
    text-align: center;
    font-size: var(--t-caption-size);
    color: var(--text-tertiary);
    line-height: 1.5;
    margin-bottom: var(--sp-md);
  }
  .sub__legal a { color: var(--text-secondary); text-decoration: underline; }

  .sub__foot {
    flex: 0 0 auto;
    padding: var(--sp-md) var(--sp-md) calc(var(--sp-md) + var(--safe-bottom));
    border-top: 1px solid var(--border-subtle);
    background: var(--bg-1);
  }
</style>
</head>
<body>
<div class="stage">

    <div class="sub">

            </span>

            <div>
              <div class="sub__benefit-name">월 300 코인 자동 적립 <span class="sub__benefit-tag">신규 필터용</span></div>
              <div class="sub__benefit-desc">신규 출시 필터를 적립 코인으로 우선 구매</div>
            </div>
          </div>
          <div class="sub__benefit">
            <span class="sub__benefit-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12 a9 9 0 1 1 18 0 a9 9 0 1 1 -18 0 z"/><path d="M12 7 V12 L15 14"/></svg>
            </span>
            <div>
              <div class="sub__benefit-name">우선 다운로드</div>
              <div class="sub__benefit-desc">신규 필터를 가장 먼저 사용</div>
            </div>
          </div>
          <div class="sub__benefit">
            <span class="sub__benefit-icon">

        <div class="sub__plans" role="radiogroup" aria-label="구독 플랜">

      <div class="sub__foot">

    <div class="home-indicator"></div>

</div>
</body>
</html>
