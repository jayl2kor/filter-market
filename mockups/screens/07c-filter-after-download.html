<!DOCTYPE html>
<!-- P0-11 · PRD §3.2 F4 (post-download — open / favorite / remove / share) · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>07c · Filter After Download — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .det { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding-top: var(--safe-top); }
  .det__hero { aspect-ratio: 4 / 5; position: relative; overflow: hidden; }
  .det__hero .photo { position: absolute; inset: 0; }
  .det__head {
    position: absolute; top: var(--safe-top); left: 0; right: 0;
    padding: var(--sp-sm) var(--sp-md);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 5;
  }
  .det__icon-btn {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.86);
    backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid; place-items: center;
  }

  .det__downloaded-pill {
    position: absolute; top: var(--safe-top); left: 50%;
    transform: translate(-50%, 56px);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid var(--success);
    font-size: var(--t-caption-size);
    font-weight: 600;
    border-radius: var(--r-full);
    z-index: 6;
  }

  .det__body { flex: 1; padding: var(--sp-md); overflow-y: auto; }
  .det__title { font-size: var(--t-title-lg-size); font-weight: 700; margin: 0; letter-spacing: -0.3px; }
  .det__author { font-size: var(--t-subhead-size); color: var(--text-secondary); margin: 4px 0 var(--sp-md); }

  .det__cta-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: var(--sp-xs);
    margin-bottom: var(--sp-md);
  }
  .det__cta-icon {
    width: 52px; height: 52px;
    border-radius: var(--r-md);
    display: grid; place-items: center;
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    color: var(--text-primary);
  }
  .det__cta-icon--active { color: var(--accent); border-color: var(--accent); }

  .det__stats {
    display: flex; justify-content: space-around;
    padding: var(--sp-md) 0;
    background: var(--bg-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg);
    margin-bottom: var(--sp-md);
  }
  .det__stat-num { font-size: var(--t-title-size); font-weight: 700; color: var(--text-primary); }
  .det__stat-label { font-size: var(--t-caption-size); color: var(--text-tertiary); margin-top: 2px; }
  .det__stat { text-align: center; }

  .det__desc { font-size: var(--t-body-size); color: var(--text-secondary); line-height: 1.6; word-break: keep-all; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="det">
      <div class="det__hero">
        <div class="photo photo--vintage photo--vignette"></div>
        <div class="det__head">
          <button class="det__icon-btn" aria-label="뒤로">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 6 L9 12 L15 18"/></svg>
          </button>
          <button class="det__icon-btn" aria-label="공유">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4 L12 16 M7 9 L12 4 L17 9 M5 14 L5 20 L19 20 L19 14"/></svg>
          </button>
        </div>
        <span class="det__downloaded-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12 L10 17 L20 7"/></svg>
          기기에 저장됨
        </span>
      </div>

      <div class="det__body">
        <h1 class="det__title">Sunset 1973</h1>
        <p class="det__author">@jisoo.films · 9.8K 다운로드</p>

        <div class="det__cta-row">
          <button class="btn btn--primary btn--lg">카메라로 적용</button>
          <button class="det__cta-icon det__cta-icon--active" aria-label="즐겨찾기 해제">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2"><path d="M5 4 L19 4 L19 21 L12 17 L5 21 Z"/></svg>
          </button>
          <button class="det__cta-icon" aria-label="컬렉션에 추가">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5 V19 M5 12 H19"/></svg>
          </button>
          <button class="det__cta-icon" aria-label="제거">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7 L19 7 M9 4 L15 4 L15 7 L9 7 Z M6 7 L7 20 L17 20 L18 7"/></svg>
          </button>
        </div>

        <div class="det__stats">
          <div class="det__stat"><div class="det__stat-num">9.8K</div><div class="det__stat-label">다운로드</div></div>
          <div class="det__stat"><div class="det__stat-num">★ 4.9</div><div class="det__stat-label">1.2K 평가</div></div>
          <div class="det__stat"><div class="det__stat-num">142</div><div class="det__stat-label">댓글</div></div>
        </div>

        <p class="det__desc">70년대 필름 카메라의 따뜻한 기억. 카페·골든아워·실내광원에 어울리는 부드러운 골드 톤. 강도 75% 이상에서 가장 자연스럽게 작동합니다.</p>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
