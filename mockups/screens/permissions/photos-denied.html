<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>P · Photos Denied — filterMarket</title>
<link rel="stylesheet" href="../../shared/fonts.css" />
<link rel="stylesheet" href="../../shared/tokens.css" />
<link rel="stylesheet" href="../../shared/components.css" />
<link rel="stylesheet" href="../../shared/phone-frame.css" />
<link rel="stylesheet" href="_shared.css" />
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <svg viewBox="0 0 18 12"><path d="M2 7 a7 7 0 0 1 14 0 M5 9 a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="screen" style="background: var(--bg-0);">
      <div class="screen__top-spacer"></div>
      <header class="topbar topbar--transparent">
        <button class="topbar__action" aria-label="뒤로">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 6 L9 12 L15 18"/></svg>
        </button>
        <span></span><span></span>
      </header>

      <main class="perm">
        <div class="perm__top">
          <div class="perm__art perm__art--denied" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <circle cx="9" cy="11" r="2"/>
              <path d="M3 16 L8 12 L13 16 L17 13 L21 17"/>
            </svg>
          </div>
          <h1 class="perm__title">사진 접근이 꺼져 있어요</h1>
          <p class="perm__body">
            저장 또는 사진 선택을 위해 설정에서 접근을 허용해주세요.
          </p>
          <ol class="perm__steps">
            <li class="perm__step">
              <span class="perm__step-num">1</span>
              <span><strong>설정</strong> 앱 열기</span>
            </li>
            <li class="perm__step">
              <span class="perm__step-num">2</span>
              <span><strong>filterMarket</strong> 선택</span>
            </li>
            <li class="perm__step">
              <span class="perm__step-num">3</span>
              <span><strong>사진</strong> → "전체 사진" 또는 "선택된 사진"</span>
            </li>
          </ol>
        </div>

        <div class="perm__bottom">
          <button class="btn btn--primary btn--block btn--lg">설정 열기</button>
          <button class="btn btn--ghost btn--block">계속 촬영만 하기</button>
        </div>
      </main>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
