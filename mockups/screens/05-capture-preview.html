<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>05 · Capture Preview — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .preview-screen {
    position: absolute;
    inset: 0;
    background: var(--bg-0);
    overflow: hidden;
  }
  .preview-photo {
    position: absolute;
    inset: 0;
  }

  .preview-top {
    position: absolute;
    top: var(--safe-top);
    left: 0; right: 0;
    padding: var(--sp-sm) var(--sp-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
  }

  .icon-btn {
    width: 40px; height: 40px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid;
    place-items: center;
    color: var(--text-primary);
  }

  /* 메타 라벨 (필터 이름) */
  .meta-pill {
    position: absolute;
    bottom: 200px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 14px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 15;
  }
  .meta-pill__dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: var(--r-full);
  }
  .meta-pill__name {
    font-size: var(--t-subhead-size);
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.1px;
  }
  .meta-pill__intensity {
    font-size: var(--t-caption-size);
    color: var(--text-secondary);
    margin-left: 6px;
    padding-left: 8px;
    border-left: 1px solid var(--border-default);
    font-variant-numeric: tabular-nums;
  }

  /* 하단 액션 */
  .preview-bottom {
    position: absolute;
    bottom: 0;
    left: 0; right: 0;
    padding: var(--sp-md) var(--sp-md) calc(var(--safe-bottom) + var(--sp-md));
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.85) 60%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: var(--sp-md);
  }

  .quick-actions {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: var(--sp-xs) 0;
  }
  .quick {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-primary);
    font-size: 10px;
    letter-spacing: 0.3px;
  }
  .quick__icon {
    width: 48px; height: 48px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid;
    place-items: center;
  }

  .save-row {
    display: flex;
    gap: var(--sp-xs);
  }
  .save-row .btn { flex: 1; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <svg viewBox="0 0 18 12"><path d="M2 7 a7 7 0 0 1 14 0 M5 9 a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="preview-screen">
      <!-- 방금 찍은 사진 -->
      <div class="preview-photo photo photo--cafe photo--vignette"></div>

      <!-- 상단 -->
      <header class="preview-top">
        <button class="icon-btn" aria-label="닫기">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
        </button>
        <button class="icon-btn" aria-label="공유">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4 L12 16 M7 9 L12 4 L17 9 M5 14 L5 20 L19 20 L19 14"/></svg>
        </button>
      </header>

      <!-- 메타 핀 -->
      <div class="meta-pill">
        <span class="meta-pill__dot"></span>
        <span class="meta-pill__name">Sunset 1973</span>
        <span class="meta-pill__intensity">75%</span>
      </div>

      <!-- 하단 -->
      <div class="preview-bottom">
        <div class="quick-actions">
          <button class="quick" aria-label="재촬영">
            <span class="quick__icon">
              <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12 a9 9 0 0 1 15.5 -6 L21 8 M21 4 L21 8 L17 8"/><path d="M21 12 a9 9 0 0 1 -15.5 6 L3 16 M3 20 L3 16 L7 16"/></svg>
            </span>
            재촬영
          </button>
          <button class="quick" aria-label="필터 변경">
            <span class="quick__icon">
              <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="4"/><circle cx="15" cy="15" r="4"/></svg>
            </span>
            필터 변경
          </button>
          <button class="quick" aria-label="편집">
            <span class="quick__icon">
              <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 5 L19 10 L8 21 L3 21 L3 16 Z"/><path d="M13 6 L18 11"/></svg>
            </span>
            편집
          </button>
          <button class="quick" aria-label="삭제">
            <span class="quick__icon">
              <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7 L19 7"/><path d="M10 11 L10 17 M14 11 L14 17"/><path d="M6 7 L7 20 L17 20 L18 7"/><path d="M9 4 L15 4 L15 7 L9 7 Z"/></svg>
            </span>
            삭제
          </button>
        </div>

        <div class="save-row">
          <button class="btn btn--secondary btn--lg btn--block">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4 L12 16 M7 11 L12 16 L17 11"/><path d="M5 20 L19 20"/></svg>
            저장
          </button>
          <button class="btn btn--primary btn--lg btn--block">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4 L12 16 M7 9 L12 4 L17 9"/><path d="M5 14 L5 20 L19 20 L19 14"/></svg>
            공유하기
          </button>
        </div>
      </div>
    </div>

    <div class="home-indicator home-indicator--dim"></div>
  </div>
</div>
</body>
</html>
