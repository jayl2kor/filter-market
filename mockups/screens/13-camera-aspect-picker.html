<!DOCTYPE html>
<!-- P0-01 · PRD §3.2 F1 (1:1/4:3/16:9 ratio) · M1-A03 · Dark -->
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>13 · Camera Aspect Picker — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .cam-screen { position: absolute; inset: 0; background: var(--bg-0); overflow: hidden; }
  .cam-preview { position: absolute; inset: 0; }
  .cam-preview .photo { position: absolute; inset: 0; }

  /* 비율 가이드 오버레이 — 선택된 비율 외 영역을 어둡게 */
  .ratio-guide { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .ratio-guide__band {
    position: absolute; left: 0; right: 0;
    background: rgba(0,0,0,0.55);
  }
  .ratio-guide__top    { top: 0; }
  .ratio-guide__bottom { bottom: 0; }
  .ratio-guide__frame {
    position: absolute; left: 0; right: 0;
    border-top: 1px solid rgba(255,255,255,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.4);
  }
  /* 9:16 (full) — bands 0 */
  .r-916 .ratio-guide__top, .r-916 .ratio-guide__bottom { display: none; }
  .r-916 .ratio-guide__frame { display: none; }
  /* 4:3 — preview height 75% of width → portrait 가운데 정렬 */
  .r-43 .ratio-guide__top    { height: 14%; }
  .r-43 .ratio-guide__bottom { height: 14%; }
  .r-43 .ratio-guide__frame  { top: 14%; bottom: 14%; }
  /* 1:1 — preview area = phone width × phone width 정사각 */
  .r-11 .ratio-guide__top    { height: 26%; }
  .r-11 .ratio-guide__bottom { height: 26%; }
  .r-11 .ratio-guide__frame  { top: 26%; bottom: 26%; }

  /* 상단: 닫기 + 비율 segmented + 더보기 */
  .cam-top {
    position: absolute; top: var(--safe-top); left: 0; right: 0;
    padding: var(--sp-sm) var(--sp-md);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 20;
  }

  .ratio-segmented {
    display: inline-flex;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    padding: 3px;
    gap: 2px;
  }
  .ratio-segmented__item {
    padding: 6px 14px;
    font-size: var(--t-caption-size);
    font-weight: 600;
    color: var(--text-secondary);
    border-radius: var(--r-full);
    letter-spacing: 0.4px;
  }
  .ratio-segmented__item--active {
    background: var(--accent);
    color: var(--text-inverse);
  }

  .icon-btn {
    width: 40px; height: 40px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid; place-items: center;
    color: var(--text-primary);
  }

  /* 하단 셔터 행 */
  .cam-bottom {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: var(--sp-md) 0 calc(var(--safe-bottom) + var(--sp-md));
    z-index: 20;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 80%);
  }
  .shutter-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 var(--sp-xl);
    gap: var(--sp-md);
  }
  .gallery-thumb {
    width: 44px; height: 44px;
    border-radius: var(--r-md);
    border: 2px solid var(--text-primary);
    overflow: hidden; justify-self: start;
  }
  .gallery-thumb .photo { width: 100%; height: 100%; }
  .shutter {
    width: 76px; height: 76px;
    background: var(--accent);
    border: 4px solid var(--bg-0);
    box-shadow: 0 0 0 3px var(--text-primary);
    border-radius: var(--r-full);
  }
  .flip-cam {
    width: 44px; height: 44px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid; place-items: center;
    color: var(--text-primary);
    justify-self: end;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="cam-screen r-43">
      <div class="cam-preview"><div class="photo photo--portrait photo--vignette"></div></div>

      <!-- 비율 가이드 오버레이 -->
      <div class="ratio-guide">
        <div class="ratio-guide__band ratio-guide__top"></div>
        <div class="ratio-guide__band ratio-guide__bottom"></div>
        <div class="ratio-guide__frame"></div>
      </div>

      <!-- 상단: 비율 segmented + 더보기 -->
      <header class="cam-top">
        <button class="icon-btn" aria-label="닫기">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
        </button>
        <div class="ratio-segmented" role="tablist" aria-label="촬영 비율">
          <button class="ratio-segmented__item">1:1</button>
          <button class="ratio-segmented__item ratio-segmented__item--active" aria-selected="true">4:3</button>
          <button class="ratio-segmented__item">16:9</button>
        </div>
        <button class="icon-btn" aria-label="더보기">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="6" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="18" r="1"/></svg>
        </button>
      </header>

      <div class="cam-bottom">
        <div class="shutter-row">
          <button class="gallery-thumb" aria-label="갤러리"><span class="photo photo--portrait"></span></button>
          <button class="shutter" aria-label="촬영"></button>
          <button class="flip-cam" aria-label="전후면">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9 L7 5 L11 9"/><path d="M3 5 L3 13 a4 4 0 0 0 4 4 L17 17"/><path d="M21 15 L17 19 L13 15"/><path d="M21 19 L21 11 a4 4 0 0 0 -4 -4 L7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
