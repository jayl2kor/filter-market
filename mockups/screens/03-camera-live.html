<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>03 · Camera Live — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .cam-screen {
    position: absolute;
    inset: 0;
    background: var(--bg-0);
    overflow: hidden;
    color: var(--text-primary);
  }
  .cam-preview {
    position: absolute;
    inset: 0;
  }
  .cam-preview .photo {
    position: absolute;
    inset: 0;
  }
  /* 그리드 (3x3 구도) */
  .cam-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .cam-grid::before, .cam-grid::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.18);
  }
  .cam-grid::before {
    left: 33.33%; top: 0; bottom: 0; width: 1px;
    box-shadow: 33.33vw 0 0 rgba(255,255,255,0.18);
    width: 1px;
  }
  /* alternate grid via inline */
  .grid-line {
    position: absolute;
    background: rgba(255,255,255,0.16);
    z-index: 5;
    pointer-events: none;
  }
  .gv1 { left: 33.33%; top: 0; bottom: 0; width: 1px; }
  .gv2 { left: 66.66%; top: 0; bottom: 0; width: 1px; }
  .gh1 { top: 33.33%; left: 0; right: 0; height: 1px; }
  .gh2 { top: 66.66%; left: 0; right: 0; height: 1px; }

  .focus-square {
    position: absolute;
    top: 38%;
    left: 56%;
    width: 64px;
    height: 64px;
    border: 1.5px solid var(--accent);
    border-radius: var(--r-sm);
    z-index: 10;
    animation: focusPulse 1.6s var(--ease-standard) infinite;
  }
  @keyframes focusPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.85); opacity: 0.7; }
  }

  /* 상단 컨트롤 */
  .cam-top {
    position: absolute;
    top: var(--safe-top);
    left: 0;
    right: 0;
    padding: var(--sp-sm) var(--sp-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: var(--sp-xs);
    padding: 6px 12px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    font-size: var(--t-caption-size);
    font-weight: 600;
    letter-spacing: 0.4px;
  }
  .pill--accent { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }

  .cam-actions {
    display: flex;
    gap: var(--sp-xs);
  }
  .icon-btn {
    width: 40px; height: 40px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid;
    place-items: center;
    color: var(--text-primary);
  }

  /* 좌우 스와이프 힌트 */
  .swipe-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    font-size: var(--t-caption-size);
    color: var(--text-secondary);
    z-index: 15;
    opacity: 0.85;
  }
  .swipe-hint--left { left: 12px; }
  .swipe-hint--right { right: 12px; }

  /* 하단 컨트롤 */
  .cam-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: var(--sp-md) 0 calc(var(--safe-bottom) + var(--sp-md));
    display: flex;
    flex-direction: column;
    gap: var(--sp-sm);
    z-index: 20;
    background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 80%);
  }

  /* 현재 필터 라벨 */
  .filter-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }
  .filter-label__name {
    font-size: var(--t-headline-size);
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .filter-label__author {
    font-size: var(--t-caption-size);
    color: var(--text-secondary);
    letter-spacing: 0.3px;
  }

  /* 셔터 행 */
  .shutter-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 var(--sp-xl);
    gap: var(--sp-md);
  }
  .gallery-thumb {
    width: 44px; height: 44px;
    border-radius: var(--r-md);
    border: 2px solid var(--text-primary);
    overflow: hidden;
    justify-self: start;
    position: relative;
  }
  .gallery-thumb .photo { width: 100%; height: 100%; }

  .shutter {
    width: 76px; height: 76px;
    background: var(--accent);
    border: 4px solid var(--bg-0);
    box-shadow: 0 0 0 3px var(--text-primary);
    border-radius: var(--r-full);
    transition: transform var(--d-fast) var(--ease-spring);
  }
  .shutter:active { transform: scale(0.92); }

  .flip-cam {
    width: 44px; height: 44px;
    background: var(--surface-overlay);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--r-full);
    display: grid;
    place-items: center;
    color: var(--text-primary);
    justify-self: end;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <svg viewBox="0 0 18 12"><path d="M2 7 a7 7 0 0 1 14 0 M5 9 a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="cam-screen">
      <!-- 라이브 프리뷰 (필터 적용된 카페 사진) -->
      <div class="cam-preview">
        <div class="photo photo--cafe photo--vignette"></div>
      </div>

      <!-- 3x3 컴포지션 그리드 -->
      <div class="grid-line gv1"></div>
      <div class="grid-line gv2"></div>
      <div class="grid-line gh1"></div>
      <div class="grid-line gh2"></div>

      <!-- 포커스 박스 -->
      <div class="focus-square" aria-hidden="true"></div>

      <!-- 상단 -->
      <header class="cam-top">
        <span class="pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
          AUTO
        </span>
        <div class="cam-actions">
          <button class="icon-btn" aria-label="플래시">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2 L4 14 L11 14 L9 22 L20 8 L13 8 Z"/></svg>
          </button>
          <button class="icon-btn" aria-label="비율">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="14" height="18" rx="2"/></svg>
          </button>
          <button class="icon-btn" aria-label="타이머">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="8"/><path d="M12 8 L12 13 L15 15 M9 3 L15 3"/></svg>
          </button>
        </div>
      </header>

      <!-- 좌우 스와이프 힌트 -->
      <div class="swipe-hint swipe-hint--left">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6 L9 12 L15 18"/></svg>
        Vintage
      </div>
      <div class="swipe-hint swipe-hint--right">
        Cool Blue
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6 L15 12 L9 18"/></svg>
      </div>

      <!-- 하단 -->
      <div class="cam-bottom">
        <div class="filter-label">
          <span class="pill pill--accent">FILTER · 75%</span>
          <div class="filter-label__name">Sunset 1973</div>
          <div class="filter-label__author">@jisoo.films</div>
        </div>

        <div class="shutter-row">
          <button class="gallery-thumb" aria-label="갤러리">
            <span class="photo photo--portrait"></span>
          </button>
          <button class="shutter" aria-label="촬영"></button>
          <button class="flip-cam" aria-label="전후면 전환">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9 L7 5 L11 9"/><path d="M3 5 L3 13 a4 4 0 0 0 4 4 L17 17"/><path d="M21 15 L17 19 L13 15"/><path d="M21 19 L21 11 a4 4 0 0 0 -4 -4 L7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
