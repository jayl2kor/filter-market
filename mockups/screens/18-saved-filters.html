<!DOCTYPE html>
<!-- P0-08 · PRD §3.2 F4 (Saved tab — downloaded + favorited + offline) · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>18 · Saved Filters — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .saved { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding-top: var(--safe-top); }
  .saved__head {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--sp-sm) var(--sp-md);
  }
  .saved__title { font-size: var(--t-title-lg-size); font-weight: 700; letter-spacing: -0.3px; }

  .saved__seg {
    display: flex; gap: var(--sp-xs);
    padding: 0 var(--sp-md) var(--sp-sm);
    overflow-x: auto; scrollbar-width: none;
  }

  .saved__body { flex: 1; overflow-y: auto; padding: var(--sp-sm) var(--sp-md) var(--sp-md); }

  .saved__row {
    display: flex; align-items: center;
    gap: var(--sp-sm);
    padding: var(--sp-sm);
    background: var(--bg-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg);
    margin-bottom: var(--sp-xs);
  }
  .saved__thumb {
    width: 56px; height: 70px;
    border-radius: var(--r-md);
    overflow: hidden;
    flex: 0 0 56px;
    position: relative;
  }
  .saved__thumb .photo { position: absolute; inset: 0; }
  .saved__thumb-badge {
    position: absolute; top: 4px; left: 4px;
    background: rgba(15,15,14,0.62);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: var(--r-sm);
    letter-spacing: 0.3px;
  }
  .saved__info { flex: 1; min-width: 0; }
  .saved__name {
    font-size: var(--t-headline-size);
    font-weight: 600;
    margin: 0 0 2px;
    color: var(--text-primary);
  }
  .saved__meta {
    font-size: var(--t-caption-size);
    color: var(--text-tertiary);
    margin: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .saved__offline-mark {
    width: 10px; height: 10px;
    color: var(--success);
  }
  .saved__action {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border-radius: var(--r-md);
    color: var(--text-secondary);
  }
  .saved__action--accent { color: var(--accent); }

  /* 빈 상태 */
  .saved__empty {
    text-align: center;
    padding: var(--sp-3xl) var(--sp-xl);
  }

  /* 5탭 + 중앙 셔터 */
  .tabbar { background: rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="saved">
      <header class="saved__head">
        <span class="saved__title">저장됨</span>
        <button class="topbar__action" aria-label="검색">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21 L16 16"/></svg>
        </button>
      </header>

      <div class="saved__seg">
        <span class="chip chip--active">전체 (24)</span>
        <span class="chip">다운로드 (18)</span>
        <span class="chip">즐겨찾기 (12)</span>
        <span class="chip">기기에 저장됨 (16)</span>

      <div class="saved__body">
        <article class="saved__row">
          <div class="saved__thumb"><div class="photo photo--vintage"></div><span class="saved__thumb-badge">★</span></div>
          <div class="saved__info">
            <p class="saved__name">Sunset 1973</p>
            <p class="saved__meta">@jisoo.films · ↓ 9.8K
              <svg class="saved__offline-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12 L10 17 L20 7"/></svg>
              오프라인 가능
            </p>
          </div>
          <button class="saved__action saved__action--accent" aria-label="적용">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="6"/><circle cx="15" cy="15" r="6"/></svg>
          </button>
        </article>

        <article class="saved__row">
          <div class="saved__thumb"><div class="photo photo--cinematic"></div></div>
          <div class="saved__info">
            <p class="saved__name">Teal Drift</p>
            <p class="saved__meta">@kihyeon · ↓ 4.2K
              <svg class="saved__offline-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12 L10 17 L20 7"/></svg>
              오프라인 가능
            </p>
          </div>
          <button class="saved__action" aria-label="더보기">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
          </button>
        </article>

        <article class="saved__row">
          <div class="saved__thumb"><div class="photo photo--bw"></div><span class="saved__thumb-badge">★</span></div>
          <div class="saved__info">
            <p class="saved__name">Mono Noir</p>
            <p class="saved__meta">@studio.haru · ↓ 12K · 다운로드 중...</p>
          </div>
          <button class="saved__action" aria-label="더보기">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
          </button>
        </article>

        <article class="saved__row">
          <div class="saved__thumb"><div class="photo photo--pastel"></div></div>
          <div class="saved__info">
            <p class="saved__name">Cotton Candy</p>
            <p class="saved__meta">@minji.lab · ↓ 7.6K
              <svg class="saved__offline-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12 L10 17 L20 7"/></svg>
              오프라인 가능
            </p>
          </div>
          <button class="saved__action saved__action--accent" aria-label="적용">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="6"/><circle cx="15" cy="15" r="6"/></svg>
          </button>
        </article>

        <article class="saved__row">
          <div class="saved__thumb"><div class="photo photo--warm"></div></div>
          <div class="saved__info">
            <p class="saved__name">Honey Hour</p>
            <p class="saved__meta">@hellofilms · ↓ 5.3K
              <svg class="saved__offline-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12 L10 17 L20 7"/></svg>
              오프라인 가능
            </p>
          </div>
          <button class="saved__action" aria-label="더보기">
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
          </button>
        </article>
      </div>

      <nav class="tabbar">
        <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>마켓</span>
        <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21 L16 16"/></svg>검색</span>
        <span class="tab tab--shutter" aria-label="카메라"><span class="tab__shutter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M9 6 L11 3 L13 3 L15 6"/></svg></span></span>
        <span class="tab tab--active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21 s-7-4.5-7-10 a4 4 0 0 1 7 -2.6 a4 4 0 0 1 7 2.6 c0 5.5 -7 10 -7 10 z"/></svg>저장됨</span>
        <span class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21 c0-4.4 3.6-8 8-8 s8 3.6 8 8"/></svg>프로필</span>
      </nav>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
