<!DOCTYPE html>
<!-- P3-05 · Block / Mute list management · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>35 · Blocked Users — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .bk { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding-top: var(--safe-top); }
  .bk__seg {
    display: flex;
    border-bottom: 1px solid var(--border-subtle);
  }
  .bk__seg-tab {
    flex: 1;
    padding: var(--sp-sm) 0;
    text-align: center;
    font-weight: 500;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
  }
  .bk__seg-tab--active { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--accent); }

  .bk__head {
    padding: var(--sp-md);
    background: var(--info-bg);
    border-bottom: 1px solid var(--info);
    display: flex; gap: var(--sp-xs); align-items: flex-start;
  }
  .bk__head-icon { width: 20px; height: 20px; color: var(--info); flex: 0 0 20px; margin-top: 2px; }
  .bk__head-text { font-size: var(--t-subhead-size); color: var(--info); line-height: 1.4; word-break: keep-all; }
  .bk__head-text strong { font-weight: 700; }

  .bk__list { flex: 1; overflow-y: auto; padding: 0 var(--sp-md) var(--sp-md); }

  .bk__row {
    display: flex; align-items: center; gap: var(--sp-sm);
    padding: var(--sp-sm) 0;
  }
  .bk__row + .bk__row { border-top: 1px solid var(--border-subtle); }

  .bk__avatar { width: 44px; height: 44px; border-radius: var(--r-full); flex: 0 0 44px; opacity: 0.6; filter: grayscale(0.5); }
  .bk__info { flex: 1; min-width: 0; }
  .bk__name { font-size: var(--t-callout-size); font-weight: 600; margin: 0; color: var(--text-secondary); }
  .bk__meta { font-size: var(--t-caption-size); color: var(--text-tertiary); margin: 2px 0 0; }
  .bk__btn {
    height: 32px; padding: 0 var(--sp-md);
    border-radius: var(--r-md);
    font-size: var(--t-subhead-size);
    font-weight: 600;
    flex: 0 0 auto;
    background: var(--bg-2);
    color: var(--text-primary);
    border: 1px solid var(--border-default);
  }

  .bk__empty {
    text-align: center;
    padding: var(--sp-3xl) var(--sp-xl);
    color: var(--text-tertiary);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="bk">
      <header class="topbar">
        <button class="topbar__action" aria-label="뒤로">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 6 L9 12 L15 18"/></svg>
        </button>
        <span class="topbar__title">차단·뮤트 관리</span>
        <span style="width: 44px;"></span>
      </header>

      <div class="bk__seg">
        <button class="bk__seg-tab bk__seg-tab--active">차단 4</button>
        <button class="bk__seg-tab">뮤트 2</button>
      </div>

      <div class="bk__head">
        <svg class="bk__head-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8 V13 M12 17 h.01"/></svg>
        <p class="bk__head-text">차단된 사용자는 회원님의 <strong>프로필·필터·댓글</strong>을 볼 수 없으며, 회원님께도 그들의 콘텐츠가 보이지 않습니다. 언제든 해제 가능합니다.</p>
      </div>

      <div class="bk__list">
        <article class="bk__row">
          <div class="bk__avatar" style="background: linear-gradient(135deg, #aab5cb, #3a4560);"></div>
          <div class="bk__info">
            <p class="bk__name">@unknown_user</p>
            <p class="bk__meta">3일 전 차단 · 저작권 침해 신고</p>
          </div>
          <button class="bk__btn">차단 해제</button>
        </article>

        <article class="bk__row">
          <div class="bk__avatar" style="background: linear-gradient(135deg, #d4a574, #8a4a3c);"></div>
          <div class="bk__info">
            <p class="bk__name">@spammer.bot</p>
            <p class="bk__meta">1주일 전 차단</p>
          </div>
          <button class="bk__btn">차단 해제</button>
        </article>

        <article class="bk__row">
          <div class="bk__avatar" style="background: linear-gradient(135deg, #6a7596, #3a4560);"></div>
          <div class="bk__info">
            <p class="bk__name">@strange_filter</p>
            <p class="bk__meta">2주일 전 차단</p>
          </div>
          <button class="bk__btn">차단 해제</button>
        </article>

        <article class="bk__row">
          <div class="bk__avatar" style="background: linear-gradient(135deg, #c47272, #4a2424);"></div>
          <div class="bk__info">
            <p class="bk__name">@another_user</p>
            <p class="bk__meta">한 달 전 차단</p>
          </div>
          <button class="bk__btn">차단 해제</button>
        </article>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
