<!DOCTYPE html>
<!-- P0-12 · Apple App Store Guideline 5.1.1(v) — account deletion · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>20 · Account Deletion — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .del { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding-top: var(--safe-top); }
  .del__body {
    flex: 1; overflow-y: auto;
    padding: 0 var(--sp-md) var(--sp-md);
  }

  .del__hero {
    text-align: center;
    padding: var(--sp-2xl) var(--sp-md) var(--sp-xl);
  }
  .del__warn-circle {
    width: 96px; height: 96px;
    border-radius: var(--r-full);
    background: var(--error-bg);
    color: var(--error);
    display: grid; place-items: center;
    margin: 0 auto var(--sp-md);
  }
  .del__title {
    font-size: var(--t-title-size);
    font-weight: 700;
    letter-spacing: -0.2px;
    margin: 0 0 var(--sp-xs);
    word-break: keep-all;
  }
  .del__sub {
    font-size: var(--t-body-size);
    color: var(--text-secondary);
    line-height: 1.5;
    word-break: keep-all;
    max-width: 320px; margin: 0 auto;
  }

  .del__list {
    background: var(--bg-2);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg);
    padding: var(--sp-sm);
    margin-bottom: var(--sp-md);
  }
  .del__list-row {
    display: flex; align-items: flex-start; gap: var(--sp-sm);
    padding: var(--sp-sm);
  }
  .del__list-row + .del__list-row { border-top: 1px solid var(--border-subtle); }
  .del__list-icon {
    flex: 0 0 24px;
    width: 24px; height: 24px;
    color: var(--error);
    margin-top: 2px;
  }
  .del__list-text {
    flex: 1;
  }
  .del__list-title { font-weight: 600; font-size: var(--t-body-size); margin: 0 0 2px; }
  .del__list-desc { font-size: var(--t-subhead-size); color: var(--text-secondary); line-height: 1.4; word-break: keep-all; }

  .del__confirm-input {
    background: var(--bg-2);
    border: 1px solid var(--border-default);
    border-radius: var(--r-md);
    padding: var(--sp-sm) var(--sp-md);
    margin-bottom: var(--sp-md);
  }
  .del__confirm-input label { display: block; font-size: var(--t-subhead-size); color: var(--text-secondary); margin-bottom: var(--sp-xxs); }
  .del__confirm-input input { width: 100%; border: 0; outline: 0; font: inherit; font-size: var(--t-body-size); color: var(--text-primary); background: transparent; }

  .del__foot {
    flex: 0 0 auto;
    padding: var(--sp-md) var(--sp-md) calc(var(--sp-md) + var(--safe-bottom));
    background: var(--bg-1);
    border-top: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; gap: var(--sp-xs);
  }
  .del__btn-primary {
    background: var(--error);
    color: var(--text-inverse);
    height: 52px;
    border-radius: var(--r-md);
    font-size: var(--t-headline-size);
    font-weight: 700;
    width: 100%;
  }
  .del__btn-cancel {
    height: 52px;
    color: var(--text-primary);
    font-weight: 500;
    width: 100%;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="del">
      <header class="topbar">
        <button class="topbar__action" aria-label="뒤로">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 6 L9 12 L15 18"/></svg>
        </button>
        <span class="topbar__title">계정 삭제</span>
        <span style="width: 44px"></span>
      </header>

      <div class="del__body">
        <div class="del__hero">
          <div class="del__warn-circle">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9 V13 M12 17 h.01"/><path d="M12 3 L22 21 L2 21 Z"/></svg>
          </div>
          <h1 class="del__title">정말 계정을 삭제할까요?</h1>
          <p class="del__sub">이 작업은 되돌릴 수 없으며, 처리에 최대 30일 소요됩니다.</p>
        </div>

        <div class="del__list">
          <div class="del__list-row">
            <svg class="del__list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="6"/><circle cx="15" cy="15" r="6"/></svg>
            <div class="del__list-text">
              <p class="del__list-title">업로드한 필터 삭제</p>
              <p class="del__list-desc">12개의 필터가 마켓에서 제거됩니다. 다른 사용자가 이미 다운로드한 필터는 그대로 사용 가능합니다.</p>
            </div>
          </div>
          <div class="del__list-row">
            <svg class="del__list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21 c0-4.4 3.6-8 8-8 s8 3.6 8 8"/></svg>
            <div class="del__list-text">
              <p class="del__list-title">프로필·팔로우 정보 삭제</p>
              <p class="del__list-desc">프로필·바이오·팔로워/팔로잉 관계가 영구 삭제됩니다.</p>
            </div>
          </div>
          <div class="del__list-row">
            <svg class="del__list-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7 L19 7 M9 4 L15 4 L15 7 L9 7 Z M6 7 L7 20 L17 20 L18 7"/></svg>
            <div class="del__list-text">
              <p class="del__list-title">다운로드한 필터 유지</p>
              <p class="del__list-desc">기기에 다운로드한 필터는 그대로 사용할 수 있지만, 메이커 정보가 익명화됩니다.</p>
            </div>
          </div>
        </div>

        <div class="del__confirm-input">
          <label for="del-confirm">계속하려면 핸들 <strong>@jisoo.films</strong>를 입력하세요</label>
          <input id="del-confirm" type="text" placeholder="@jisoo.films"/>
        </div>
      </div>

      <div class="del__foot">
        <button class="del__btn-primary" disabled aria-disabled="true">계정 영구 삭제</button>
        <button class="del__btn-cancel">취소</button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
