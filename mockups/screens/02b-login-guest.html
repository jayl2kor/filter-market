<!DOCTYPE html>
<!-- P0-05 · PRD §3.2 F6 (Guest mode) · Light -->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>02b · Login + Guest — moodit</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .login { position: absolute; inset: 0; background: var(--bg-1); display: flex; flex-direction: column; padding: var(--safe-top) var(--sp-md) calc(var(--sp-md) + var(--safe-bottom)); }
  .login__hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--sp-md); text-align: center; padding: var(--sp-xl); }
  .login__brand { display: inline-flex; gap: 4px; align-items: center; justify-content: center; margin-bottom: var(--sp-sm); }
  .login__brand-circle { width: 14px; height: 14px; border-radius: var(--r-full); }
  .login__brand-circle--ring { border: 2px solid var(--accent); }
  .login__brand-circle--fill { background: var(--accent); }
  .login__title { font-size: var(--t-title-lg-size); font-weight: 700; letter-spacing: -0.3px; margin: 0; color: var(--text-primary); }
  .login__sub { color: var(--text-secondary); font-size: var(--t-body-size); margin: 0; word-break: keep-all; }

  .login__methods { display: flex; flex-direction: column; gap: var(--sp-xs); }
  .auth-btn {
    display: flex; align-items: center; gap: var(--sp-sm);
    width: 100%;
    height: 52px;
    padding: 0 var(--sp-lg);
    border-radius: var(--r-md);
    font-size: var(--t-headline-size);
    font-weight: 600;
    text-align: left;
  }
  .auth-btn--apple { background: var(--text-primary); color: var(--text-inverse); }
  .auth-btn--google { background: var(--bg-2); color: var(--text-primary); border: 1px solid var(--border-default); }
  .auth-btn--email { background: var(--bg-2); color: var(--text-primary); border: 1px solid var(--border-default); }
  .auth-btn svg { width: 20px; height: 20px; flex: 0 0 20px; }

  .login__divider {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: var(--sp-sm);
    margin: var(--sp-sm) 0 var(--sp-xs);
    color: var(--text-tertiary);
    font-size: var(--t-caption-size);
  }
  .login__divider::before, .login__divider::after { content: ''; height: 1px; background: var(--border-subtle); }

  /* 게스트 진입 */
  .login__guest {
    display: flex; flex-direction: column; gap: var(--sp-xs);
    align-items: center;
  }
  .login__guest-btn {
    color: var(--text-secondary);
    font-size: var(--t-callout-size);
    font-weight: 500;
    padding: var(--sp-sm);
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: var(--border-default);
  }
  .login__guest-note {
    font-size: var(--t-caption-size);
    color: var(--text-tertiary);
    text-align: center;
    max-width: 240px;
    line-height: 1.4;
    word-break: keep-all;
  }

  .login__legal {
    margin-top: var(--sp-md);
    text-align: center;
    font-size: var(--t-caption-size);
    color: var(--text-tertiary);
    line-height: 1.5;
  }
  .login__legal a { color: var(--text-secondary); text-decoration: underline; text-underline-offset: 2px; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="login">
      <section class="login__hero">
        <div class="login__brand" aria-label="moodit">
          <span class="login__brand-circle login__brand-circle--ring"></span>
          <span class="login__brand-circle login__brand-circle--fill"></span>
        </div>
        <h1 class="login__title">moodit에 오신 걸<br/>환영합니다</h1>
        <p class="login__sub">라이브 카메라 + 메이커가 만든 필터.<br/>당신의 분위기를 담으세요.</p>
      </section>

      <div class="login__methods">
        <button class="auth-btn auth-btn--apple">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2c.3 1.4-.3 2.8-1.1 3.6-.9.9-2.1 1.6-3.4 1.5-.3-1.3.3-2.7 1.1-3.5.9-1 2.2-1.6 3.4-1.6Zm4.4 16.7c-1.1 1.6-2.2 3.2-4.1 3.3-1.7 0-2.3-1-4.3-1-1.9 0-2.6 1-4.2 1-1.8 0-3.1-1.6-4.3-3.3C2 16.5 .9 11.5 3.4 8.5c1.4-1.6 3.5-2.6 5-2.6 1.7 0 2.7 1 4.1 1 1.4 0 2.5-1.1 4.4-1.1 1.5 0 3.4 .9 4.5 2.4-3.9 2.2-3.4 7.6.5 9.5Z"/></svg>
          Apple로 로그인
        </button>
        <button class="auth-btn auth-btn--google">
          <svg viewBox="0 0 24 24"><path d="M22 12.2c0-.8-.1-1.4-.2-2.1H12v3.9h5.6c-.2 1.3-1 2.4-2 3.1v2.6h3.3c1.9-1.8 3.1-4.4 3.1-7.5z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.6c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3v2.6C4.7 19.7 8.1 22 12 22z" fill="#34A853"/><path d="M6.4 13.9c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.5H3a10 10 0 0 0 0 9z" fill="#FBBC05"/><path d="M12 5.8c1.5 0 2.8.5 3.8 1.5l2.9-2.9C16.9 2.8 14.7 2 12 2 8.1 2 4.7 4.3 3 7.5l3.4 2.6c.8-2.3 3-4.3 5.6-4.3z" fill="#EA4335"/></svg>
          Google로 로그인
        </button>
        <button class="auth-btn auth-btn--email">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8 L12 14 L21 8"/></svg>
          이메일로 계속하기
        </button>
      </div>

      <div class="login__divider"><span>또는</span></div>

      <div class="login__guest">
        <button class="login__guest-btn">로그인 없이 둘러보기</button>
        <p class="login__guest-note">필터 다운로드·업로드·평점은 로그인 후에 가능합니다.</p>
      </div>

      <p class="login__legal">계속하면 <a href="#">서비스 약관</a>과 <a href="#">개인정보 처리방침</a>에 동의한 것으로 간주합니다.</p>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
