<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>01 · Onboarding — moodit (EN)</title>
<link rel="stylesheet" href="../shared/fonts.css" />
<link rel="stylesheet" href="../shared/tokens.css" />
<link rel="stylesheet" href="../shared/components.css" />
<link rel="stylesheet" href="../shared/phone-frame.css" />
<style>
  .onb-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(110% 70% at 50% 0%, var(--accent-bg) 0%, transparent 55%),
      var(--bg-0);
    overflow: hidden;
  }
  .onb-hero { position: relative; flex: 1; overflow: hidden; }
  .onb-hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(250,250,247,0.0) 0%, rgba(250,250,247,0.0) 40%, rgba(250,250,247,0.96) 100%);
    z-index: 1;
  }

  .onb-skip {
    position: absolute; top: var(--safe-top); right: var(--sp-md);
    z-index: 30; padding: 8px 14px;
    color: var(--text-secondary); font-size: var(--t-callout-size); font-weight: 500;
    background: rgba(255,255,255,0.78); backdrop-filter: blur(20px);
    border: 1px solid var(--border-subtle); border-radius: var(--r-full);
  }

  .onb-stages {
    position: absolute; top: var(--safe-top); left: 50%;
    transform: translateX(-50%); display: flex; gap: 6px;
    z-index: 30; padding: 14px 0;
  }
  .onb-stages span {
    width: 32px; height: 3px; background: var(--border-default);
    border-radius: var(--r-full); transition: all var(--d-base) var(--ease-standard);
  }
  .onb-stages span.active { background: var(--accent); width: 32px; }

  .onb-copy {
    position: relative; z-index: 10;
    padding: var(--sp-2xl) var(--sp-xl) calc(var(--safe-bottom) + var(--sp-2xl));
    background: linear-gradient(180deg, transparent 0%, var(--bg-0) 30%);
  }
  .onb-eyebrow {
    font-size: var(--t-caption-size); color: var(--accent); font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .onb-title {
    font-size: 32px; line-height: 38px; font-weight: 700;
    letter-spacing: -0.5px; margin: 12px 0 var(--sp-sm); color: var(--text-primary);
  }
  .onb-title em { font-style: normal; color: var(--accent); }
  .onb-body {
    color: var(--text-secondary); font-size: var(--t-body-size); line-height: 1.5;
    margin-bottom: var(--sp-xl);
  }

  .stack {
    position: absolute; top: 16%; left: 0; right: 0;
    display: flex; justify-content: center; perspective: 1200px;
    z-index: 5; padding: 0 var(--sp-xl);
  }
  .stack__card {
    width: 130px; aspect-ratio: 4/5; border-radius: var(--r-lg);
    overflow: hidden; position: relative;
    box-shadow: 0 18px 44px rgba(15,15,14,0.16), 0 4px 10px rgba(15,15,14,0.06);
    border: 1px solid var(--border-subtle); background: var(--bg-2);
  }
  .stack__card--left { transform: translateX(40px) rotate(-8deg) scale(0.9); z-index: 1; }
  .stack__card--center { z-index: 3; margin: 0 -16px; transform: scale(1.05); }
  .stack__card--right { transform: translateX(-40px) rotate(8deg) scale(0.9); z-index: 1; }
  .stack__card .photo { width: 100%; height: 100%; }
  .stack__card-name {
    position: absolute; bottom: 8px; left: 8px; right: 8px;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    padding: 4px 8px; border-radius: var(--r-sm);
    font-size: 10px; font-weight: 600; text-align: center; color: var(--text-primary);
  }
  .stack__card-name--accent { color: var(--accent); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="dynamic-island"></div>
    <div class="statusbar">
      <span class="statusbar__time">9:41</span>
      <span class="statusbar__indicators">
        <svg viewBox="0 0 18 12"><path d="M1 8 L4 5 L7 8 L10 3 L13 6 L17 2" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <svg viewBox="0 0 18 12"><path d="M2 7 a7 7 0 0 1 14 0 M5 9 a4 4 0 0 1 8 0" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="9" cy="10.5" r="1" fill="currentColor"/></svg>
        <span class="statusbar__battery"><span class="statusbar__battery-fill"></span></span>
      </span>
    </div>

    <div class="onb-screen">
      <a class="onb-skip">Skip</a>
      <div class="onb-stages" aria-label="Step 1 of 3">
        <span class="active"></span>
        <span></span>
        <span></span>
      </div>

      <section class="onb-hero">
        <div class="stack fade-in">
          <div class="stack__card stack__card--left">
            <div class="photo photo--vintage photo--vignette"></div>
            <div class="stack__card-name">Sunset</div>
          </div>
          <div class="stack__card stack__card--center">
            <div class="photo photo--cinematic photo--vignette"></div>
            <div class="stack__card-name stack__card-name--accent">Teal</div>
          </div>
          <div class="stack__card stack__card--right">
            <div class="photo photo--moody photo--vignette"></div>
            <div class="stack__card-name">Mood</div>
          </div>
        </div>
      </section>

      <section class="onb-copy">
        <div class="onb-eyebrow fade-in fade-in--delay-1">moodit · 01</div>
        <h1 class="onb-title fade-in fade-in--delay-2">
          Light from every maker,<br/>
          <em>in one place</em>
        </h1>
        <p class="onb-body fade-in fade-in--delay-3">
          Apply thousands of GPU filters from creators around the world directly in your live camera. Golden hour is no longer something to wait for.
        </p>
        <button class="btn btn--primary btn--block btn--lg fade-in fade-in--delay-4">
          Get Started
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12 L19 12 M13 6 L19 12 L13 18"/></svg>
        </button>
      </section>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>
</body>
</html>
