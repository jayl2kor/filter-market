<?xml version="1.0" encoding="UTF-8"?>
<!--
  Moodit Symbol — "Twin Lens" (v0.3)
  Two circles drawn from the "oo" in moodit. Outline ring = viewer; filled
  disc = maker. Both rendered with identical visible outer diameter (22u);
  the outline is r=9.75 with stroke=2.5 so its outer edge sits at 11u to
  match the filled circle's r=11.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" role="img" aria-label="Moodit">
  <circle cx="16" cy="16" r="9.75" fill="none" stroke="#B8853A" stroke-width="2.5"/>
  <circle cx="48" cy="16" r="11" fill="#B8853A"/>
</svg>
