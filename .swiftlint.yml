included:
  - Sources
  - Tests
excluded:
  - .build
  - DerivedData
  - "**/Generated"
opt_in_rules:
  - empty_collection_literal
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
disabled_rules:
  - trailing_comma
  - multiple_closures_with_trailing_closure
  - identifier_name
line_length:
  warning: 140
  error: 180
file_length:
  warning: 400
  error: 800
function_body_length:
  warning: 60
  error: 100
type_body_length:
  warning: 250
  error: 400
custom_rules:
  no_print:
    name: "no_print"
    regex: "(?<!swift)\\bprint\\("
    message: "use os_log/Logger instead of print"
    severity: warning
